name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/portfolio-modernization]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Quality, build and Playwright
    runs-on: ubuntu-24.04
    # Match this image to the lockfile's Playwright version. The digest pins
    # browser binaries, system libraries and system fonts as one reviewed unit.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --init --shm-size=1g
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TZ: UTC
      # Ordinary verification must never use a production SMTP account.
      AUTH_USER: ''
      AUTH_PASS: ''
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify image Node.js 24 LTS
        run: |
          node -e 'if (process.versions.node.split(".")[0] !== "24") throw new Error("The pinned image must provide Node.js 24"); console.log(`::notice title=Image runtime::Node ${process.version}; ${process.platform}/${process.arch}`)'

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: ESLint
        id: lint
        run: npm run lint

      - name: Production build
        id: build
        run: npm run build

      # Build generates Next.js declarations before the standalone type check.
      - name: TypeScript
        id: types
        run: npm run typecheck -- --incremental false

      - name: Verify bundled Chromium and record environment
        id: browser
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { readFileSync } from 'node:fs';
          const browser = await chromium.launch();
          try {
            console.log(`::notice title=Playwright runtime::Node ${process.version}; Chromium ${browser.version()}; ${process.arch}; ${chromium.executablePath()}`);
            console.log(JSON.stringify({
              os: readFileSync('/etc/os-release', 'utf8'),
              architecture: process.arch,
              nodeVersion: process.version,
              browserVersion: browser.version(),
              executable: chromium.executablePath(),
            }, null, 2));
          } finally {
            await browser.close();
          }
          NODE

      - name: Playwright
        id: tests
        run: npm test

      - name: Upload Playwright reports and failure evidence
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          include-hidden-files: false
          if-no-files-found: warn

      - name: Summarize verification
        if: ${{ !cancelled() }}
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs';
          const checks = ['DEPENDENCIES', 'LINT', 'BUILD', 'TYPES', 'BROWSER', 'TESTS'];
          const lines = ['## CI verification', '', '| Check | Result |', '| --- | --- |'];
          for (const check of checks) {
            lines.push(`| ${check} | ${process.env[check] || 'not run'} |`);
          }
          const results = 'test-results/results.json';
          if (existsSync(results)) {
            const { stats } = JSON.parse(readFileSync(results, 'utf8'));
            lines.push('', `Playwright: ${stats.expected} passed, ${stats.unexpected} failed, ${stats.skipped} skipped, ${stats.flaky} flaky.`);
            lines.push('', 'Download the playwright-results artifact from this run for the HTML report and failure traces/screenshots.');
          } else {
            lines.push('', 'No Playwright results were produced. Inspect the failed prerequisite step above.');
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
